<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centro Médico Integral Vida - Turnos Online</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- Encabezado -->
        <div class="header">
            <img src="https://images.unsplash.com/photo-1519494026892-80bbd2d6fd0d?auto=format&fit=crop&w=150&q=80" alt="Logo Centro Médico" class="logo">
            <h1>Centro Médico Integral Vida</h1>
            <p>Sistema de Gestión y Reserva de Turnos Online</p>
        </div>

        <!-- Botones de Acceso Rápido (Derivaciones y WhatsApp) -->
        <div class="menu-accesos">
            <a href="https://docs.google.com/forms/d/e/1FAIpQLSeIFDwbw5pQqvzayzM0fJ0dcZEr1CYOKX-hs_JRUuSLeRM3iw/viewform?usp=dialog" target="_blank" class="btn btn-derivacion">
                📋 Formulario de Derivación
            </a>
            <a href="https://wa.me/5492325460892?text=Hola,%20me%20comunico%20desde%20el%20Consultorio%20Online%20para%20realizar%20una%20consulta." target="_blank" class="btn btn-whatsapp">
                💬 Contactar por WhatsApp
            </a>
        </div>

        <hr class="divider">

        <!-- Formulario de Turnos -->
        <form id="formTurno">
            <div class="form-group">
                <label for="especialista">Seleccione Especialista y Especialidad:</label>
                <select id="especialista" required>
                    <option value="">Elija un profesional</option>
                    <option value="Dr. Pérez - Cardiología">Dr. Pérez - Cardiología</option>
                    <option value="Dra. Gómez - Pediatría">Dra. Gómez - Pediatría</option>
                    <option value="Dr. Rodríguez - Clínica Médica">Dr. Rodríguez - Clínica Médica</option>
                </select>
            </div>

            <div class="form-group">
                <label for="fechaTurno">Fecha del Turno:</label>
                <input type="date" id="fechaTurno" required>
            </div>

            <div class="form-group">
                <label for="horario">Horario (De 08:00 a 12:00 hs):</label>
                <select id="horario" required>
                    <option value="">Seleccione un horario</option>
                    <option value="08:00">08:00 hs</option>
                    <option value="09:00">09:00 hs</option>
                    <option value="10:00">10:00 hs</option>
                    <option value="11:00">11:00 hs</option>
                    <option value="12:00">12:00 hs</option>
                </select>
            </div>

            <div class="form-group">
                <label for="nombrePaciente">Nombre y Apellido del Paciente:</label>
                <input type="text" id="nombrePaciente" placeholder="Ej: Juan Pérez" required>
            </div>

            <div class="form-group">
                <label for="correoPaciente">Correo Electrónico:</label>
                <input type="email" id="correoPaciente" placeholder="correo@ejemplo.com" required>
            </div>

            <div class="form-group">
                <label for="obraSocial">Obra Social / Prepaga:</label>
                <input type="text" id="obraSocial" placeholder="Ej: Swiss Medical, OSECAC, Particular" required>
            </div>

            <button type="submit" class="btn btn-submit">Reservar Turno</button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
